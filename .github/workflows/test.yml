name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm test
      # 演示数据能完整生成（种子脚本覆盖了几乎所有业务路径）
      - run: node --no-warnings=ExperimentalWarning scripts/seed.js --reset --db /tmp/caiguo-ci.db
